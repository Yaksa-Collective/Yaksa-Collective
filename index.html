<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yaksa: poems, writings and practice.">
  <meta name="theme-color" content="#15170f">
  <title>Yaksa</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <style>
    :root {
      --ink: #15170f;
      --paper: #eeeade;
      --muted: #a8a99c;
      --line: rgba(238, 234, 222, .18);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.6;
    }

    a { color: inherit; }

    .hero {
      min-height: 100svh;
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      isolation: isolate;
      background: #222719 url("assets/rice-field-poster.webp") center / cover no-repeat;
    }

    .hero-animation {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(9, 12, 7, .58) 0%, rgba(9, 12, 7, .12) 36%, rgba(9, 12, 7, .46) 100%),
        linear-gradient(90deg, rgba(9, 12, 7, .18), transparent 55%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(32, 38, 20, .08);
      mix-blend-mode: multiply;
    }

    .topbar {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .mark,
    nav a {
      font-family: Arial, Helvetica, sans-serif;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav { display: flex; gap: clamp(1rem, 2.5vw, 2.2rem); }
    nav a { opacity: .82; transition: opacity 160ms ease; }
    nav a:hover, nav a:focus-visible { opacity: 1; }

    .hero-title {
      align-self: center;
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2rem 0 5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .8;
      text-shadow: 0 2px 35px rgba(0, 0, 0, .28);
    }

    .hero-title p {
      margin: 1.6rem 0 0 .35rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .down {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 0 0 1.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .7rem;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
      opacity: .72;
    }

    main {
      width: min(960px, calc(100% - 3rem));
      margin: 0 auto;
      padding: clamp(5rem, 10vw, 9rem) 0;
    }

    .intro {
      max-width: 740px;
      margin: 0 0 5rem;
      font-size: clamp(1.7rem, 3.5vw, 3rem);
      line-height: 1.25;
    }

    .rooms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
    }

    .room {
      min-height: 230px;
      padding: 1.6rem 1.5rem 1.7rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
    }

    .room + .room {
      padding-left: 1.5rem;
      border-left: 1px solid var(--line);
    }

    .room small {
      display: block;
      margin-bottom: 3.5rem;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .7rem;
      letter-spacing: .12em;
    }

    .room h2 { margin: 0 0 .75rem; font-size: 1.8rem; font-weight: 400; }
    .room p { margin: 0; color: #c4c2b9; font-size: .95rem; }

    footer {
      width: min(960px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
    }

    @media (max-width: 720px) {
      .topbar { align-items: flex-start; }
      nav { display: grid; grid-template-columns: repeat(2, auto); gap: .45rem 1.1rem; }
      nav a { font-size: .65rem; }
      .hero-title { padding-bottom: 2rem; }
      h1 { font-size: clamp(4.7rem, 26vw, 8rem); }
      .rooms { grid-template-columns: 1fr; }
      .room { min-height: auto; padding: 1.6rem 0 2rem; }
      .room + .room { padding-left: 0; border-left: 0; }
      .room small { margin-bottom: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-animation { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <img class="hero-animation" src="assets/rice-field-loop.webp" alt="" aria-hidden="true">

    <header class="topbar">
      <a class="mark" href="index.html">Yaksa</a>
      <nav aria-label="Main navigation">
        <a href="poems.html">Poems</a>
        <a href="writings.html">Writings</a>
        <a href="practice.html">Practice</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="hero-title">
      <h1>Yaksa</h1>
      <p>Poems · writings · practice</p>
    </div>

    <a class="down" href="#work">The work ↓</a>
  </section>

  <main id="work">
    <p class="intro">Buddhism, food and ordinary life.</p>

    <div class="rooms">
      <a class="room" href="poems.html">
        <small>01</small>
        <h2>Poems</h2>
        <p>Poems, sequences and collections.</p>
      </a>
      <a class="room" href="writings.html">
        <small>02</small>
        <h2>Writings</h2>
        <p>Essays, reflections and longer prose.</p>
      </a>
      <a class="room" href="practice.html">
        <small>03</small>
        <h2>Practice</h2>
        <p>Meditation, mindful eating and daily life.</p>
      </a>
    </div>
  </main>

  <footer>© <span id="year"></span> Yaksa</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

  </script>
</body>
</html>
